# A imagem base traz AllowOverride None para /var/www/, o que faz o .htaccess do
# WordPress ser ignorado — e todo permalink bonito vira 404.
#
# Em vez de depender do .htaccess (que o WP só consegue gerar pelo painel, nunca
# pelo WP-CLI), as regras ficam aqui: um `docker compose up` num volume limpo já
# sobe com permalinks funcionando.
<Directory /var/www/html/>
	Options FollowSymLinks
	AllowOverride All
	Require all granted

	<IfModule mod_rewrite.c>
		RewriteEngine On
		RewriteBase /

		# Preserva o header Authorization para a REST API.
		RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

		RewriteRule ^index\.php$ - [L]

		# Arquivo ou diretório real é servido direto; o resto vai para o WordPress.
		RewriteCond %{REQUEST_FILENAME} !-f
		RewriteCond %{REQUEST_FILENAME} !-d
		RewriteRule . /index.php [L]
	</IfModule>
</Directory>
