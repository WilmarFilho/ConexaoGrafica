
services:
  db:
    image: mariadb:10.11
    container_name: conexao_editora_db
    environment:
      MARIADB_DATABASE: conexao
      MARIADB_USER: conexao
      MARIADB_PASSWORD: conexao
      MARIADB_ROOT_PASSWORD: conexao
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  wp:
    image: wordpress:php8.3-apache
    container_name: conexao_editora_wp
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8092:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: conexao
      WORDPRESS_DB_USER: conexao
      WORDPRESS_DB_PASSWORD: conexao
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('DISALLOW_FILE_EDIT', true);
    volumes:
      - wp_core:/var/www/html
      - ./wp-content/themes/conexao-editora:/var/www/html/wp-content/themes/conexao-editora
      - ./wp-content/uploads:/var/www/html/wp-content/uploads

  cli:
    image: wordpress:cli-php8.3
    container_name: conexao_editora_cli
    depends_on:
      - wp
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: conexao
      WORDPRESS_DB_USER: conexao
      WORDPRESS_DB_PASSWORD: conexao
    volumes:
      - wp_core:/var/www/html
      - ./wp-content/themes/conexao-editora:/var/www/html/wp-content/themes/conexao-editora
      - ./wp-content/uploads:/var/www/html/wp-content/uploads
      - ./scripts:/scripts
    entrypoint: ["tail", "-f", "/dev/null"]

volumes:
  db_data:
  wp_core:
