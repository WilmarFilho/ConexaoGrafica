name: Deploy para produção

# Todo push na main publica o plugin e o tema em graficaconexao.com.br.
# workflow_dispatch permite disparar manualmente pela aba Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Dois deploys simultâneos poderiam escrever no mesmo diretório.
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    name: Enviar para o cPanel
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar PHP 8.2
        # A mesma versão de produção. O runner traz 8.3, e o apt do Ubuntu 24.04
        # não tem pacote php8.2-cli — daí a action.
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Checar sintaxe PHP
        # Um parse error derruba o site inteiro. Barato demais para não checar.
        run: |
          php -v | head -1
          erros=0
          while IFS= read -r arquivo; do
            php -l "$arquivo" > /dev/null || { echo "::error file=$arquivo::erro de sintaxe"; erros=1; }
          done < <(find wp-content -name '*.php')
          echo "Arquivos verificados: $(find wp-content -name '*.php' | wc -l)"
          exit $erros

      - name: Preparar a chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # known_hosts fixo: sem isso o StrictHostKeyChecking não protege de nada.
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Enviar plugin e tema
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          # A rede da Hostinger descarta parte dos IPs dos runners do GitHub: a
          # mesma configuração conecta numa execução e expira na seguinte. Por
          # isso as tentativas repetidas — cada uma sai de um IP diferente.
          enviar() {
            # --delete só dentro das duas pastas enviadas: nunca em wp-content
            # inteiro, senão os uploads do cliente iriam junto.
            # --chmod fixa as permissões no destino: o checkout do runner não
            # carrega as do cPanel, e copiá-las às cegas deixaria o site quebrado.
            rsync -az --delete --chmod=D755,F644 \
              --exclude='.git*' \
              --exclude='node_modules' \
              -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT -o StrictHostKeyChecking=yes -o ConnectTimeout=20" \
              "wp-content/$1/" \
              "$SSH_USER@$SSH_HOST:$REMOTE_PATH/wp-content/$1/"
          }

          for pasta in plugins/conexao-core themes/conexao; do
            tentativa=1
            until enviar "$pasta"; do
              if [ "$tentativa" -ge 6 ]; then
                echo "::error::$pasta não subiu após 6 tentativas — provável bloqueio de rede"
                exit 1
              fi
              espera=$(( tentativa * 20 ))
              echo "tentativa $tentativa falhou; repetindo em ${espera}s"
              sleep "$espera"
              tentativa=$(( tentativa + 1 ))
            done
            echo "$pasta enviado na tentativa $tentativa"
          done

      - name: Limpar cache de rewrite
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        # Se o WP-CLI não existir no servidor, o deploy não deve falhar por isso.
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST" \
            "cd $REMOTE_PATH && wp rewrite flush --skip-plugins=akismet 2>/dev/null || true"

      - name: Remover a chave
        if: always()
        run: rm -f ~/.ssh/id_deploy
